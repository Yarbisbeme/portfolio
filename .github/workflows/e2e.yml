# Compila el portfolio, lo prueba a sí mismo con Cypress + Cucumber y publica
# los resultados reales en /automation (commit a public/automation/).
name: E2E · el portfolio se prueba a sí mismo

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/automation/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BROWSER: chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (incluye el binario de Cypress)
        run: npm ci

      - name: Compilar el sitio estático
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_AUTHOR_NAME: ${{ vars.NEXT_PUBLIC_AUTHOR_NAME }}
          NEXT_PUBLIC_LOCATION: ${{ vars.NEXT_PUBLIC_LOCATION }}
          NEXT_PUBLIC_ROLE_TITLE: ${{ vars.NEXT_PUBLIC_ROLE_TITLE }}
          NEXT_PUBLIC_ROLE_TAGLINE: ${{ vars.NEXT_PUBLIC_ROLE_TAGLINE }}
          NEXT_PUBLIC_ROLE_SHORT: ${{ vars.NEXT_PUBLIC_ROLE_SHORT }}
          NEXT_PUBLIC_TIMEZONE: ${{ vars.NEXT_PUBLIC_TIMEZONE }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_PUBLIC_GITHUB_URL: ${{ vars.NEXT_PUBLIC_GITHUB_URL }}
          NEXT_PUBLIC_LINKEDIN_URL: ${{ vars.NEXT_PUBLIC_LINKEDIN_URL }}
          NEXT_PUBLIC_CV_BACKEND_URL: ${{ vars.NEXT_PUBLIC_CV_BACKEND_URL }}
          NEXT_PUBLIC_CV_QA_URL: ${{ vars.NEXT_PUBLIC_CV_QA_URL }}
          NEXT_PUBLIC_META_DESC_ES: ${{ vars.NEXT_PUBLIC_META_DESC_ES }}
          NEXT_PUBLIC_HERO_LINE1_ES: ${{ vars.NEXT_PUBLIC_HERO_LINE1_ES }}
          NEXT_PUBLIC_HERO_LINE2_ES: ${{ vars.NEXT_PUBLIC_HERO_LINE2_ES }}
          NEXT_PUBLIC_CONTACT_BODY_ES: ${{ vars.NEXT_PUBLIC_CONTACT_BODY_ES }}
          NEXT_PUBLIC_FOOTER_ES: ${{ vars.NEXT_PUBLIC_FOOTER_ES }}
          NEXT_PUBLIC_META_DESC_EN: ${{ vars.NEXT_PUBLIC_META_DESC_EN }}
          NEXT_PUBLIC_HERO_LINE1_EN: ${{ vars.NEXT_PUBLIC_HERO_LINE1_EN }}
          NEXT_PUBLIC_HERO_LINE2_EN: ${{ vars.NEXT_PUBLIC_HERO_LINE2_EN }}
          NEXT_PUBLIC_CONTACT_BODY_EN: ${{ vars.NEXT_PUBLIC_CONTACT_BODY_EN }}
          NEXT_PUBLIC_FOOTER_EN: ${{ vars.NEXT_PUBLIC_FOOTER_EN }}
        run: npm run build

      - name: Servir ./out en :4173
        run: |
          npm run serve:out > /tmp/serve.log 2>&1 &
          npx wait-on http://localhost:4173/es/ --timeout 30000

      - name: Correr la suite (Cypress + Cucumber)
        id: e2e
        continue-on-error: true
        run: npm run test:e2e

      - name: Generar el reporte para /automation
        if: always()
        run: npm run report:automation

      - name: Guardar capturas de fallos como artefacto
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Publicar resultados (commit a public/automation)
        if: always()
        run: |
          git config user.name "portfolio-e2e"
          git config user.email "actions@users.noreply.github.com"
          git add public/automation
          if git diff --cached --quiet; then
            echo "Sin cambios en los resultados."
          else
            git commit -m "chore(automation): resultados e2e de ${GITHUB_SHA::7} [skip ci]"
            git push
          fi

      - name: Marcar el job en rojo si la suite falló
        if: steps.e2e.outcome == 'failure'
        run: exit 1
